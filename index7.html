            <h2>Dúvidas Frequentes</h2>
            <dl>
                <dt>Quanto tempo dura a extensão de cílios?</dt>
                <dd>Em média, de 15 a 20 dias, sendo necessária a manutenção após esse período.</dd>

                <dt>A henna dura quanto tempo na pele?</dt>
                <dd>Depende do tipo de pele. Em peles oleosas dura menos, mas a média é de 3 a 7 dias na pele e até 15 dias no pelo.</dd>
